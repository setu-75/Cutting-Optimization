<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Busy watcher test with debug readout</title>
<style>
body{background:#0B1620;color:#E7EEF5;font-family:sans-serif;margin:0}
.container{position:relative;z-index:0;background:#101E2B;border:1px solid #28405A;border-radius:6px;margin:16px 8px;padding:24px 10px;min-height:380px}
.box{background:#16273A;border:1px solid #28405A;border-radius:8px;padding:16px;margin:12px 6px}
.d3-glowframe{position:absolute;inset:5px;border-radius:10px;border:2px solid transparent;background:conic-gradient(from 0deg,#F0A93B,#FFD27D,#9FE7FF,#4A90C4,#F0A93B) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:.85;animation:d3-breathe 7s ease-in-out infinite;pointer-events:none;z-index:0}
.d3-glowbleed{position:absolute;inset:0;box-shadow:inset 0 0 34px rgba(240,169,59,.20),inset 0 0 60px rgba(90,150,210,.12);opacity:.85;animation:d3-breathe 7s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes d3-breathe{0%,100%{opacity:.55}50%{opacity:1}}
body.d3-busy .d3-glowframe{background:conic-gradient(from 0deg,#F0A93B,#FFD27D,#E8930C,#FFAA3C,#F0A93B) border-box;animation-duration:1.8s}
body.d3-busy .d3-glowbleed{box-shadow:inset 0 0 44px rgba(240,169,59,.45),inset 0 0 70px rgba(240,169,59,.20);animation-duration:1.8s}
button{border:none;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer;margin:6px}
#optimize-btn{background:#F0A93B}
#deep-search-btn{background:#1C3149;color:#E7EEF5;border:1px solid #F0A93B}
#debug{background:#000;color:#7CFC90;font-family:monospace;font-size:15px;padding:12px;margin:12px 6px;border-radius:6px;white-space:pre-wrap}
</style></head><body>
<div class="container">
  <div class="d3-glowbleed"></div><div class="d3-glowframe"></div>
  <h2 style="margin:6px">Busy watcher test — exact watcher code from the site block</h2>
  <div class="box">Click "Deep search" — it mimics the app: Optimize button disables, Deep button gets class "running" and text "Stop deep search (N s)" for 6 seconds.</div>
  <button id="optimize-btn">Optimize Cutting Plan</button>
  <button id="deep-search-btn">Deep search</button>
  <div id="debug">debug: (waiting)</div>
</div>
<script>
// --- fake app behaviour (mirrors the real app's deep-search handler) ---
var deepBtn = document.getElementById('deep-search-btn');
var optimizeBtn = document.getElementById('optimize-btn');
deepBtn.addEventListener('click', function(){
  var label = deepBtn.textContent;
  optimizeBtn.disabled = true;
  deepBtn.classList.add('running');
  var t0 = Date.now();
  deepBtn.textContent = 'Stop deep search (0 s)';
  var tick = setInterval(function(){ deepBtn.textContent = 'Stop deep search (' + Math.round((Date.now()-t0)/1000) + ' s)'; }, 500);
  setTimeout(function(){
    clearInterval(tick);
    optimizeBtn.disabled = false;
    deepBtn.classList.remove('running');
    deepBtn.textContent = label;
  }, 6000);
});
// --- watcher code copied from the site block (paintGlow omitted: no arcs here) ---
var glowBusy = false;
var dbg = document.getElementById('debug');
setInterval(function(){
  var ob = document.getElementById("optimize-btn");
  var db = document.getElementById("deep-search-btn");
  var now = !!((ob && ob.disabled) || (db && db.classList.contains("running")));
  if (now !== glowBusy) {
    glowBusy = now;
    document.body.classList.toggle("d3-busy", now);
  }
  dbg.textContent = "debug: busy=" + glowBusy + " | ob.disabled=" + (ob && ob.disabled) + " | db.running=" + (db && db.classList.contains("running")) + " | db.text=" + (db && db.textContent) + " | body.class=" + document.body.className;
}, 300);
</script>
</body></html>
