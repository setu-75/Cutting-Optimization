<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Inner glow frame test — tight margins like the live site</title>
<style>
body{background:#0B1620;color:#E7EEF5;font-family:sans-serif;margin:0;padding:0}
.container{position:relative;z-index:0;background:#101E2B;border:1px solid #28405A;border-radius:6px;margin:16px 8px;padding:24px 10px;min-height:420px}
.box{background:#16273A;border:1px solid #28405A;border-radius:8px;padding:18px;margin:14px 6px}
.frame-glow{position:absolute;inset:5px;border-radius:10px;border:2px solid transparent;background:conic-gradient(from 0deg,#F0A93B,#FFD27D,#9FE7FF,#4A90C4,#F0A93B) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:.85;animation:tb 7s ease-in-out infinite;pointer-events:none}
.frame-bleed{position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 34px rgba(240,169,59,.20),inset 0 0 60px rgba(90,150,210,.12);opacity:.85;animation:tb 7s ease-in-out infinite;pointer-events:none}
@keyframes tb{0%,100%{opacity:.5}50%{opacity:.95}}
body.d3-busy .frame-glow{background:conic-gradient(from 0deg,#F0A93B,#FFD27D,#E8930C,#FFAA3C,#F0A93B) border-box;animation-duration:1.8s}
body.d3-busy .frame-bleed{box-shadow:inset 0 0 44px rgba(240,169,59,.45),inset 0 0 70px rgba(240,169,59,.20);animation-duration:1.8s}
button{background:#F0A93B;border:none;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer;margin:10px 6px}
</style></head><body>
<div class="container" id="c">
  <div class="frame-glow"></div><div class="frame-bleed"></div>
  <h2 style="margin:6px">Fake live container — margins only 8px, like the real site</h2>
  <div class="box">Inner panel 1 — the glow frame runs just inside the container's edge.</div>
  <div class="box">Inner panel 2 — watch the frame brightness for ~15 seconds: it should slowly swell and fade (breathing).</div>
  <button id="busyBtn">Simulate busy (6 seconds)</button>
</div>
<script>
document.getElementById("busyBtn").addEventListener("click", function(){
  document.body.classList.add("d3-busy");
  setTimeout(function(){ document.body.classList.remove("d3-busy"); }, 6000);
});
</script>
</body></html>
